services:
  claude:
    build:
      context: .
      args:
        - EXTRA_PACKAGES=${EXTRA_PACKAGES}
    image: claude:latest
    volumes:
      - ${CLAUDE_DIR:-~/.claude}:/home/ubuntu/.claude
      - ${CLAUDE_JSON:-~/.claude.json}:/home/ubuntu/.claude.json
      - ${PROJECT}:/home/ubuntu/${PROJECT_NAME:-project}
      - mitmproxy-data:/home/ubuntu/.mitmproxy:ro
    working_dir: /home/ubuntu/${PROJECT_NAME:-project}
    stdin_open: true
    tty: true
    environment:
      - HTTP_PROXY=http://claude-in-docker-sidecar:8080
      - HTTPS_PROXY=http://claude-in-docker-sidecar:8080
      - NODE_EXTRA_CA_CERTS=/home/ubuntu/.mitmproxy/mitmproxy-ca-cert.pem
    depends_on:
      claude-in-docker-sidecar:
        condition: service_healthy
    networks:
      - claude-net

  claude-in-docker-sidecar:
    image: mitmproxy/mitmproxy
    command: mitmdump --listen-host 0.0.0.0 --listen-port 8080
    volumes:
      - mitmproxy-data:/home/mitmproxy/.mitmproxy
    healthcheck:
      test: ["CMD", "test", "-f", "/home/mitmproxy/.mitmproxy/mitmproxy-ca-cert.pem"]
      interval: 1s
      timeout: 5s
      retries: 10
    networks:
      - claude-net
      - internet-net

networks:
  claude-net:
    # internal: true
    internal: false # TODO: change back after finishing work
  internet-net:
    internal: false

volumes:
  mitmproxy-data: